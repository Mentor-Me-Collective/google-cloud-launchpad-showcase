name: LearnLite Backend and Sync CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Python Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r apps/api/requirements.txt \
            -r apps/api/tests/requirements-dev.txt

      - name: Validate Python syntax
        run: |
          python -m compileall -q apps/api/main.py apps/api/app

      - name: Run backend and security tests
        working-directory: apps/api
        run: |
          python -m pytest -q tests/

  offline-sync-tests:
    name: Offline Synchronization Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run synchronization engine tests
        run: |
          node --test packages/sync-engine/tests/*.test.mjs
